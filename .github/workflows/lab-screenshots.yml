name: Lab screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lab-screenshots.yml"
      - ".github/scripts/lab-shots.mjs"
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Take screenshots
        run: node .github/scripts/lab-shots.mjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lab/*.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Update lab website screenshots"
          git push
